name: Demo on Pages

# The addon is what this repository ships, so consuming projects take it as a submodule and clone
# everything on this branch. A web export is tens of megabytes and git cannot delta a .wasm, so the
# export is built here and handed straight to Pages rather than committed.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.8-dev4
  ADDON: gta

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Godot and its export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          unzip -q templates.tpz
          # The .tpz unpacks to templates/; Godot looks for them under the version's own directory.
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}/"

      - name: Fetch the player controller the demo builds on
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kirbycope/godot-3d-player-controller-addon.git             demo/addons/3d_player_controller
          rm -rf demo/addons/3d_player_controller/.git

      - name: Put the addon where the demo project expects it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "demo/addons/${ADDON}"
          # Everything the addon ships, which is the repository minus its own scaffolding.
          # Anchored with a leading slash: unanchored, 'demo' also matches scenes/demo/,
          # which is where most of these addons keep the demo scene itself.
          rsync -a --exclude '/.git' --exclude '/.github' --exclude '/demo' \
                --exclude '/.gitignore' --exclude '/.gitattributes' ./ "demo/addons/${ADDON}/"

      - name: Export the demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo/build
          # Import repeatedly before exporting. One pass only registers the files; each further pass
          # writes the resources whose dependencies the previous pass produced, and an asset-heavy
          # addon needs several. Exporting early ships scenes whose textures were never written to
          # .godot/imported, which the browser reports as a corrupt texture.
          for _ in 1 2 3 4; do
            godot --headless --path demo --import
          done
          godot --headless --path demo --export-release "Web" build/index.html

      - name: Upload the export
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
